# Camera source: "0" for the default webcam, "1" for another camera, or an IP stream URL.
camera:
  source: "0"
  width: 640
  height: 480
  reconnect_attempts: 3
  reconnect_delay_seconds: 1.0

perception:
  detector_model: "yolov8n.pt"
  detector_backend: "yolo"  # yolo or yolo-world; falls back to YOLOv8n if YOLO-World is unavailable
  world_model: "yolov8s-worldv2.pt"
  world_classes: ["person", "chair", "bottle", "door", "table", "stairs"]
  confidence: 0.45
  image_size: 640
  device: "auto"  # auto, cpu, or cuda:0
  enable_depth: true
  depth_model: "depth-anything/Depth-Anything-V2-Small-hf"
  depth_mode: "metric"
  metric_depth_scale: 1.0
  metric_depth_offset: 0.0
  metric_warning_distance_m: 1.5
  metric_critical_distance_m: 0.8
  depth_bounds_ema_alpha: 0.12
  depth_every_n_frames: 3
  enable_tracking: true
zoedepth:
  enabled: true
  model: "Intel/zoedepth-nyu"
  distance_scale: 0.5
  distance_offset: 0.0
  device: "auto"

navigation:
  near_relative_depth_threshold: 0.72
  large_box_area_threshold: 0.12
  corridor_box_area_threshold: 0.025
  corridor_y_start: 0.48
  speech_cooldown_seconds: 3.0
  target_guidance_interval_seconds: 2.0
  require_confident_free_space: true

voice:
  enabled: true
  speech_recognition: "vosk"  # vosk (offline, optional) or disabled
  vosk_model_path: "models/vosk-model-small-en-us-0.15"
  tts_enabled: true
  tts_rate: 175

app:
  show_depth_window: true
  show_dashboard: true
  log_level: "INFO"

scene_description:
  enabled: true
  primary_provider: "groq"       # groq or local
  fallback_provider: "local"     # local
  groq_model: "qwen/qwen3.8-27b"
  timeout_seconds: 12.0
  cooldown_seconds: 2.5
  max_retries: 1
  jpeg_quality: 80

